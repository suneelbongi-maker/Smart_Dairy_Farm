<!DOCTYPE html>
<html>

<head>

    <title>Milk Production</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<header>

    <h1>🥛 Milk Production</h1>

</header>


<nav>

    <a href="/">Dashboard</a>
    <a href="/cows">Cows</a>
    <a href="/milk">Milk</a>
    <a href="/health">Health</a>
    <a href="/feed">Feed</a>
    <a href="/sales">Sales</a>

</nav>


<main>

    <div class="page-title">

        <h2>Milk Records</h2>

        <a class="button" href="/add_milk">
            + Add Milk Record
        </a>

    </div>


    <table>

        <tr>

            <th>Cow ID</th>
            <th>Date</th>
            <th>Morning</th>
            <th>Evening</th>
            <th>Total</th>

        </tr>


        {% for item in milk %}

        <tr>

            <td>{{ item.cow_id }}</td>

            <td>{{ item.date }}</td>

            <td>{{ item.morning }} L</td>

            <td>{{ item.evening }} L</td>

            <td>
                <strong>
                    {{ item.total_milk }} L
                </strong>
            </td>

        </tr>

        {% else %}

        <tr>

            <td colspan="5">
                No milk records found.
            </td>

        </tr>

        {% endfor %}

    </table>

</main>

</body>

</html>

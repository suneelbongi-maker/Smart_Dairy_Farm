<!DOCTYPE html>
<html>

<head>

    <title>Add Milk</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<header>

    <h1>🥛 Add Milk Production</h1>

</header>


<nav>

    <a href="/">Dashboard</a>
    <a href="/milk">Milk</a>

</nav>


<main>

    <div class="form-container">

        <h2>Milk Production Details</h2>

        <form method="POST">

            <label>Cow ID</label>

            <select name="cow_id" required>

                {% for cow in cows %}

                <option value="{{ cow.id }}">

                    {{ cow.id }} - {{ cow.name }}

                </option>

                {% endfor %}

            </select>


            <label>Date</label>

            <input
                type="date"
                name="date"
                required
            >


            <label>Morning Milk (Litres)</label>

            <input
                type="number"
                step="0.1"
                name="morning"
                required
            >


            <label>Evening Milk (Litres)</label>

            <input
                type="number"
                step="0.1"
                name="evening"
                required
            >


            <button type="submit">
                Save Milk Record
            </button>

        </form>

        <p class="info">
            Total milk is calculated automatically.
        </p>

    </div>

</main>

</body>

</html>

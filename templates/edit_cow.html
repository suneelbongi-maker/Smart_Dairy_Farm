<!DOCTYPE html>
<html>

<head>

    <title>Edit Cow</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<header>

    <h1>✏️ Edit Cow</h1>

</header>


<nav>

    <a href="/">Dashboard</a>
    <a href="/cows">Cows</a>

</nav>


<main>

    <div class="form-container">

        <h2>Edit Cow Information</h2>

        <form method="POST">

            <label>Cow ID</label>

            <input
                type="text"
                value="{{ cow.id }}"
                disabled
            >


            <label>Cow Name</label>

            <input
                type="text"
                name="name"
                value="{{ cow.name }}"
                required
            >


            <label>Breed</label>

            <input
                type="text"
                name="breed"
                value="{{ cow.breed }}"
                required
            >


            <label>Age</label>

            <input
                type="number"
                name="age"
                value="{{ cow.age }}"
                required
            >


            <label>Health Status</label>

            <select name="health">

                <option
                    {% if cow.health == "Healthy" %}selected{% endif %}>
                    Healthy
                </option>

                <option
                    {% if cow.health == "Needs Checkup" %}selected{% endif %}>
                    Needs Checkup
                </option>

                <option
                    {% if cow.health == "Under Treatment" %}selected{% endif %}>
                    Under Treatment
                </option>

            </select>


            <button type="submit">
                Update Cow
            </button>

        </form>

    </div>

</main>

</body>

</html>
